<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">DeMarco's Fine Foods restored logo</title>
  <desc id="desc">A faithful illustrated restoration of the original family market logo with preserves, juice, tomatoes, bananas, fruit, orange ribbon and green Fine Foods badge.</desc>
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F47B35"/><stop offset=".52" stop-color="#E45E27"/><stop offset="1" stop-color="#C8441F"/></linearGradient>
    <linearGradient id="ribbonTail" x1="0" x2="1"><stop stop-color="#A9361C"/><stop offset="1" stop-color="#D65324"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#70B94E"/><stop offset="1" stop-color="#3E8A38"/></linearGradient>
    <linearGradient id="bottle" x1="0" x2="1"><stop stop-color="#F7BF57"/><stop offset=".5" stop-color="#E99B2F"/><stop offset="1" stop-color="#C96E23"/></linearGradient>
    <radialGradient id="tomato" cx="35%" cy="28%"><stop stop-color="#F67B5A"/><stop offset=".45" stop-color="#D94E3A"/><stop offset="1" stop-color="#A52D2B"/></radialGradient>
    <radialGradient id="apple" cx="35%" cy="30%"><stop stop-color="#F07755"/><stop offset=".5" stop-color="#CC4234"/><stop offset="1" stop-color="#963129"/></radialGradient>
    <linearGradient id="banana" x1="0" x2="1"><stop stop-color="#FFE26B"/><stop offset=".6" stop-color="#F5C73B"/><stop offset="1" stop-color="#D99A23"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <path id="scriptCurve" d="M260 391 Q500 340 740 391"/>
  </defs>
  <g transform="translate(-55 74) scale(.76)" stroke="#75422E" stroke-linejoin="round" stroke-linecap="round">
    <!-- Original dense produce arrangement -->
    <g stroke-width="6">
      <!-- preserves jar, far left -->
      <path fill="#B64A4B" d="M135 319 122 171q-3-26 34-30l52-5q35-2 37 26l8 153Z"/>
      <path fill="#D84135" d="M117 174q-5-34 36-39l54-5q39-2 43 31l2 20-133 13Z"/>
      <path fill="#F06B51" d="M126 153q52-23 113-3" stroke="#FFB08A" stroke-width="4"/>
      <path fill="#8F4B70" d="m143 211 87-9 10 91-87 11Z"/>
      <path d="M151 225q40-18 76-7" fill="none" stroke="#D799B2" stroke-width="5" opacity=".8"/>
      <!-- pale jar behind -->
      <path fill="#F5C96B" d="M213 320 221 190q2-24 31-25l50 3q28 3 27 28l-3 127Z"/>
      <path fill="#C83B31" d="M215 192q-1-31 39-31l45 3q36 4 33 33Z"/>
      <path fill="#E9553D" d="M221 175q52-13 103 4" stroke="#FF967D" stroke-width="4"/>
      <!-- signature juice bottle -->
      <path fill="url(#bottle)" d="M278 319 303 115q4-29 29-36l13-4 34 3 14 11q19 13 17 39l-10 199Z"/>
      <path fill="#C93B2F" d="M306 105q1-35 39-37l24 2q38 5 35 40l-2 14-98-7Z"/>
      <path fill="#F4E6C7" d="m307 164 93 8-7 114-101-7Z"/>
      <path fill="#FFF9E8" d="m323 172 23 2-7 99-25-2Z" stroke="none" opacity=".72"/>
      <path d="M316 132q37-13 81 4" fill="none" stroke="#FFD083" stroke-width="6" opacity=".85"/>
      <!-- bowl and tomatoes -->
      <path fill="#EFD39B" d="M400 246q102-43 211 1l-20 94q-88 39-173-2Z"/>
      <path fill="#D7B67B" d="M405 260q98 27 200 0"/>
      <ellipse cx="449" cy="226" rx="46.5" ry="42" fill="url(#tomato)"/>
      <ellipse cx="510" cy="207" rx="51" ry="45.5" fill="url(#tomato)"/>
      <ellipse cx="571" cy="230" rx="47.5" ry="43" fill="url(#tomato)"/>
      <path fill="#3D8539" d="m510 169-16-18 20 6 13-21 2 24 24-2-21 15Z"/>
      <path fill="#4B913D" d="m447 191-12-13 17 4 11-14-1 18 17 2-17 8Z"/>
      <path fill="#4B913D" d="m572 195-12-14 16 5 12-15-1 19 18 1-18 9Z"/>
      <path d="M425 277q84 21 161-2" fill="none" stroke="#FFF1C3" stroke-width="6" opacity=".7"/>
      <!-- bananas preserving original fan -->
      <path fill="url(#banana)" d="M563 310q29-150 92-234 33 146-20 248Z"/>
      <path fill="url(#banana)" d="M627 321q49-136 114-199 14 143-45 213Z"/>
      <path fill="url(#banana)" d="M684 326q54-112 117-157-2 119-60 170Z"/>
      <path d="M590 287q27-107 61-171M659 298q36-91 76-136" fill="none" stroke="#FFF095" stroke-width="8" opacity=".75"/>
      <!-- right fruit cluster -->
      <path fill="#6DA342" d="M739 325q-14-70 42-103 58 22 48 98Z"/>
      <path fill="#397E38" d="M770 221q-2-57 58-83-3 57-58 83Z"/>
      <ellipse cx="841" cy="298" rx="61" ry="67" fill="url(#apple)"/>
      <path fill="#41843B" d="M829 239q8-43 49-51-4 44-49 51Z"/>
      <ellipse cx="819" cy="276" rx="15" ry="28" fill="#FFB184" stroke="none" opacity=".5" transform="rotate(-24 819 276)"/>
      <path fill="#8BB846" d="M888 332q1-54 45-76 49 24 43 82Z"/>
      <path fill="#3C7F39" d="M927 257q3-38 42-49-5 38-42 49Z"/>
    </g>

    <!-- original serrated Fine Foods seal -->
    <path fill="url(#badge)" stroke-width="7" d="M329 386 359 369 385 387 413 369 439 388 467 370 494 389 522 370 549 389 577 370 604 389 631 370 659 388 687 370 713 388 742 371 770 389 758 434 744 452 752 476 728 490 729 516 702 522 694 548 668 545 655 570 630 560 611 584 588 568 565 590 543 571 518 591 498 570 472 587 455 562 428 573 417 547 389 550 382 523 354 517 357 490 332 477 341 452 324 434Z"/>
    <path d="M356 405q145-39 387 0" fill="none" stroke="#A8D471" stroke-width="6" opacity=".75"/>

    <!-- original ribbon proportions -->
    <g stroke-width="8">
      <path fill="url(#ribbonTail)" d="M103 364 248 332 267 465 119 500 149 445Z"/>
      <path fill="url(#ribbonTail)" d="M752 332 898 365 850 446 881 501 733 465Z"/>
      <path fill="#9E301A" d="m231 428 41 37-9-72Z"/>
      <path fill="#9E301A" d="m770 427-39 38 8-72Z"/>
      <path fill="url(#ribbon)" d="M215 314Q500 254 786 314L761 452Q500 398 239 452Z"/>
      <path d="M240 333q259-50 521 0" fill="none" stroke="#FF9A54" stroke-width="7" opacity=".72"/>
      <path d="M247 425q253-45 507 0" fill="none" stroke="#B83D20" stroke-width="5" opacity=".65"/>
    </g>
    <circle cx="266" cy="383" r="9" fill="#F8E8C7" stroke="none"/><circle cx="734" cy="383" r="9" fill="#F8E8C7" stroke="none"/>

    <!-- warmer hand-painted lettering -->
    <text x="500" y="408" text-anchor="middle" fill="#FFF9E9" stroke="none" font-family="SignPainter, 'Brush Script MT', cursive" font-size="108" font-weight="600" letter-spacing="-3" transform="rotate(-1 500 408)">DeMarco’s</text>
    <text x="500" y="506" text-anchor="middle" fill="#FFF9E9" stroke="none" font-family="'Avenir Next Condensed', Futura, sans-serif" font-size="48" font-weight="700" letter-spacing="6">FINE FOODS</text>
    <path d="M398 529q102 13 205 0" fill="none" stroke="#E7F2CF" stroke-width="3" opacity=".7"/>
  </g>
  </svg>